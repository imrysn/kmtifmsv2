<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/src/assets/fms-icon.ico" />
  <link rel="icon" type="image/png" href="/src/assets/fms-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KMTI File Management System</title>
  <style>
    /* Inline loading screen - shows INSTANTLY before JS loads */
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #initial-loader.loaded {
      display: none;
    }

    .loader-content {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      animation: fadeIn 0.3s ease-in-out;
      width: 100%;
      max-width: 500px;
      padding: 40px;
    }

    .loader-logo {
      font-size: 38px;
      font-weight: 600;
      color: #1c1e21;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .loader-title {
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 50px;
    }

    @keyframes loading-ui-infinity-square-snake {
      0%, 100% { transform: translate(4ch, 0); }
      12.5% { transform: translate(0, 0); }
      25% { transform: translate(0, 4ch); }
      37.5% { transform: translate(4ch, 4ch); }
      50% { transform: translate(4ch, 0); }
      62.5% { transform: translate(8ch, 0); }
      75% { transform: translate(8ch, 4ch); }
      87.5% { transform: translate(4ch, 4ch); }
    }

    .infinity-snake-container {
      position: relative;
      display: inline-flex;
      height: 5ch;
      width: 9ch;
      overflow: hidden;
      font-family: monospace;
      line-height: 1;
      color: #000000;
      font-size: 1.5rem;
      user-select: none;
      margin: 40px auto;
    }

    .infinity-snake-glyph {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      height: 1ch;
      width: 1ch;
      align-items: center;
      justify-content: center;
      animation: loading-ui-infinity-square-snake 3.2s linear infinite;
    }

    .loader-message {
      font-size: 12px;
      color: #9ca3af;
      font-weight: 500;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Hide root until React loads to prevent flash */
    #root:empty {
      display: none;
    }
  </style>
</head>

<body>
  <!-- Instant loading screen - no JS required -->
  <div id="initial-loader">
    <div class="loader-content">
      <div class="loader-logo">KMTI</div>
      <div class="loader-title">File Management System</div>

      <div class="infinity-snake-container">
        <span class="infinity-snake-glyph" style="animation-delay: calc(0.1s * -3)">█</span>
        <span class="infinity-snake-glyph" style="animation-delay: calc(0.1s * -2)">▓</span>
        <span class="infinity-snake-glyph" style="animation-delay: calc(0.1s * -1)">▒</span>
        <span class="infinity-snake-glyph" style="animation-delay: calc(0.1s * 0)">░</span>
      </div>

      <div class="loader-message">Loading application...</div>
    </div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

  <script src="./loader.js"></script>
</body>

</html>
